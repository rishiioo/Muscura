services:
  # Backend Service
  - type: web
    name: muscura-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CLIENT_URL
        value: https://muscura-t55d.vercel.app

  # Frontend (Static Site) - Optional if you use Vercel
  - type: static
    name: muscura-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://muscura-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://muscura-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html