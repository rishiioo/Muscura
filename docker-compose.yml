version: '3.8'

services:
  muscura-backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb+srv://xisco55:xisco123098@cluster0.naonokj.mongodb.net/muscura
      - JWT_SECRET=muscura_secret_key_2024
      - EMAIL_USER=xisco@gmail.com
      - EMAIL_PASS=xisco@123098
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  muscura-frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - CHROME_OTYPE=none
    depends_on:
      - muscura-backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/build:/usr/share/nginx/html/frontend
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - muscura-frontend
    restart: unless-stopped